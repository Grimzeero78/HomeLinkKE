<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HomeLinkKE — Houses, Apartments & Rentals across Kenya</title>
<meta name="description" content="Find vacant houses, bedsitters and apartments anywhere in Kenya. Chat with landlords directly, see houses near you on the map. Never pay before viewing.">
<meta property="og:title" content="HomeLinkKE — Find a house anywhere in Kenya">

<meta name="theme-color" content="#0e5a33">
<script>
// apply the theme before the stylesheet paints. Like every other website:
// a saved choice (light/dark) wins, otherwise the site follows the DEVICE's
// own light/dark setting (system default) and switches automatically.
(function(){try{var t=localStorage.getItem('hl_theme');
if(t!=='dark'&&t!=='light')t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="/styles.css">
</head>
