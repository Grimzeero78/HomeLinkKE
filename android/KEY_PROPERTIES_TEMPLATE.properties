# Copy this file to android/key.properties (same folder as app/build.gradle)
# AFTER you generate your keystore (see README step 4.1).
# NEVER commit key.properties or your .jks keystore to GitHub.
storePassword=YOUR_KEYSTORE_PASSWORD
keyPassword=YOUR_KEY_PASSWORD
keyAlias=huntinke
storeFile=/full/path/to/huntinke-key.jks
